name: Build MsM.Tv APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            ls -la
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir source
          unzip -q "$ZIP" -d source
          find source -maxdepth 3 -type f -name settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: |
          gradle -p source/MsM.Tv-main/android assembleMobileDebug assembleTvDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MsM-Tv-APKs
          path: |
            source/MsM.Tv-main/android/app/build/outputs/apk/mobile/debug/*.apk
            source/MsM.Tv-main/android/app/build/outputs/apk/tv/debug/*.apk
