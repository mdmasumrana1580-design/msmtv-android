name: Build MsM.Tv APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            ls -la
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          find source -name build.gradle -path '*/app/build.gradle'

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("source").glob("**/app/build.gradle"))
          if not files:
              raise SystemExit("App build.gradle not found")

          p = files[0]
          s = p.read_text()

          block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          if "compileOptions" not in s:
              s = s.replace("android {", block, 1)

          p.write_text(s)
          print("Updated:", p)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: |
          DIR=$(find source -type f -name settings.gradle | head -n 1)
          if [ -z "$DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          gradle -p "$(dirname "$DIR")" assembleMobileDebug assembleTvDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MsM-Tv-APKs
          path: |
            source/**/app/build/outputs/apk/mobile/debug/*.apk
            source/**/app/build/outputs/apk/tv/debug/*.apk
